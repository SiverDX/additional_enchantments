plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven { url "https://cursemaven.com" }
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.caffeinemc.net/releases" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
            programArguments.addAll '--username', 'Dev####'
        }

        client_static {
            client()
            gameDirectory = project.file('runs/client_static')
            // The UUID is the one that will get assigned in multiplayer based on the name 'Dev'
            programArguments.addAll '--username', 'Dev', "--uuid", "380df991-f603-344c-a090-369bad2a924a"
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
        }

        gameTestServer {
            type = "gameTestServer"
        }

        data {
            clientData()
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "maven.modrinth:sodium:mc26.1.2-0.9.2-alpha.4-neoforge"
    // For some reason 'Sodium' is considered a non-minecraft library due to the weird jar-in-jar setup
    // See https://docs.neoforged.net/toolchain/docs/dependencies/nonmclibs/
//    additionalRuntimeClasspath "maven.modrinth:sodium:mc1.21.1-0.8.13-beta.2-neoforge"
    // Jar-in-jar setup from the whole mod prevents the source from being available
    implementation "net.caffeinemc:sodium-neoforge-mod:0.9.2-alpha.4+mc26.1.2"

    compileOnly "maven.modrinth:iris:1.11.3+26.1-neoforge"

    // Bumblezone
//    compileOnly "curse.maven:the-bumblezone-forge-362479:8548224" // v7.15.3
//    compileOnly "curse.maven:resourceful-lib-570073:5973188" // 3.0.12

    // Create
//    compileOnly "maven.modrinth:create:6.0.10+mc1.21.1"

    // Not Enough Animations
    // https://www.curseforge.com/minecraft/mc-mods/not-enough-animations/files/all?page=1&pageSize=20&version=1.21.1&gameVersionTypeId=6&showAlphaFiles=show
    compileOnly "maven.modrinth:not-enough-animations:KPrjbsQg" // 1.12.4

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
